<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ponte Cafe &amp; Eatery - Thực đơn</title>
  <!-- Google Fonts for Bistro Aesthetics -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       RESET & THEME VARIABLES
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-canvas: #F5EFEB;
      --bg-mobile: #FAF6F0;
      --card-bg: #FFFFFF;
      --ink: #261B14;
      --ink-muted: #5C4A3E;
      --ink-subtle: #7A6759;
      --caramel: #A7742A;
      --caramel-dark: #8F5E18;
      --caramel-soft: rgba(167, 116, 42, 0.12);
      --border-line: #E5DACB;
      --border-light: #EDE4D6;
      --shadow-sm: 0 2px 8px rgba(38, 27, 20, 0.04);
      --shadow-md: 0 8px 24px rgba(38, 27, 20, 0.08);
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: var(--bg-canvas);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      scroll-behavior: smooth;
    }

    /* iOS: khi modal mở, khóa scroll toàn bộ trang */
    html.modal-open,
    html.modal-open body {
      overflow: hidden !important;
      position: fixed !important;
      width: 100% !important;
      height: 100% !important;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      margin: 0;
      padding: 0;
    }

    /* Mobile container frame */
    .mobile-frame {
      width: 100%;
      max-width: 580px;
      min-height: 100vh;
      background-color: var(--bg-mobile);
      position: relative;
      box-shadow: 0 10px 40px rgba(44, 30, 35, 0.08);
      display: flex;
      flex-direction: column;
      padding-bottom: 16px;
    }

    .hero-banner {
      width: 100%;
      height: clamp(150px, 38vw, 220px);
      overflow: hidden;
      background: var(--border-light);
    }

    .hero-banner img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 45%;
    }

    /* ==========================================================================
       TOP APP BAR
       ========================================================================== */
    .top-app-bar {
      position: -webkit-sticky;
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 248, 245, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--border-line);
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .brand-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--caramel);
      color: #fff;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--ink-subtle);
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10B981;
      display: inline-block;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border-line);
      background: #fff;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.15s ease;
    }

    .language-select {
      height: 36px;
      padding: 0 8px;
      border: 1px solid var(--border-line);
      border-radius: 10px;
      background: #FFFFFF;
      color: var(--ink);
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      outline: none;
    }

    /* Search Box */
    .search-box {
      display: none;
      padding: 8px 12px;
      background: #FFF0ED;
      border-bottom: 1px solid var(--border-line);
    }

    .search-box.open {
      display: block;
    }

    .search-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      height: 38px;
      padding: 0 32px 0 34px;
      border-radius: 12px;
      border: 1px solid var(--border-line);
      background: #fff;
      font-size: 13px;
      color: var(--ink);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--caramel);
    }

    .search-icon-left {
      position: absolute;
      left: 12px;
      color: var(--ink-subtle);
      font-size: 14px;
      pointer-events: none;
    }

    .search-clear-btn {
      position: absolute;
      right: 10px;
      border: none;
      background: none;
      color: var(--ink-subtle);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
    }

    /* ==========================================================================
       MAIN 2-COLUMN LAYOUT:
       LEFT: 2 PRIMARY INDEX TABS (FOOD & DRINKS) + THEIR CORRESPONDING SUB-MENUS
       RIGHT: SCROLLABLE FEED
       ========================================================================== */
    .menu-main-layout {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 10px;
    }

    /* LEFT VERTICAL RAIL */
    .category-rail-vertical {
      position: -webkit-sticky;
      position: sticky;
      top: 60px;
      z-index: 30;
      width: 82px;
      flex: 0 0 82px;
      max-height: calc(100vh - 72px);
      max-height: calc(100dvh - 72px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .category-rail-vertical::-webkit-scrollbar {
      display: none;
    }

    /* Primary Category Switcher Box (Food vs Drink) */
    .primary-switch-box {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-line);
      border-radius: 14px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      box-shadow: var(--shadow-sm);
    }

    .primary-switch-btn {
      width: 100%;
      padding: 6px 2px;
      border: none;
      background: transparent;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      transition: all 0.18s ease;
    }

    .primary-switch-btn .p-icon {
      font-size: 16px;
      line-height: 1;
    }

    .primary-switch-btn .p-label {
      font-size: 10px;
      font-weight: 800;
      color: var(--ink-muted);
    }

    .primary-switch-btn.active {
      background: var(--caramel);
      box-shadow: 0 2px 6px rgba(201, 105, 121, 0.28);
    }

    .primary-switch-btn.active .p-label {
      color: #FFFFFF;
    }

    /* Subcategories Box */
    .subcategories-box {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-line);
      border-radius: 14px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      box-shadow: var(--shadow-sm);
    }

    .sub-section-title {
      font-size: 8.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-subtle);
      text-align: center;
      padding: 3px 0 2px;
      border-bottom: 1px solid var(--border-line);
      margin-bottom: 2px;
    }

    .subcat-btn {
      width: 100%;
      min-height: 44px;
      border: none;
      background: transparent;
      border-radius: 10px;
      padding: 5px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      cursor: pointer;
      color: var(--ink-muted);
      transition: all 0.18s ease;
      position: relative;
    }

    .subcat-btn .sub-icon {
      font-size: 15px;
      line-height: 1;
    }

    .subcat-btn .sub-label {
      font-size: 9.5px;
      font-weight: 800;
      line-height: 1.15;
      text-align: center;
      word-break: break-word;
      overflow-wrap: anywhere;
      color: var(--ink-muted);
    }

    .subcat-btn:hover {
      background: #FFF5F2;
    }

    .subcat-btn.active {
      background: linear-gradient(135deg, #DF7F8F, var(--caramel));
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(201, 105, 121, 0.25);
    }

    .subcat-btn.active .sub-label {
      color: #FFFFFF;
    }

    /* RIGHT DISH FEED */
    .dish-feed {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-bottom: 8px;
    }

    .category-section {
      scroll-margin-top: 68px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--border-line);
    }

    .section-header .sec-icon {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      background: #FFFFFF;
      border: 1px solid var(--border-line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .section-header h2 {
      font-size: 15px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.01em;
      word-break: break-word;
      line-height: 1.25;
    }

    .section-header .count-tag {
      font-size: 11px;
      color: var(--ink-subtle);
      font-weight: 600;
      margin-left: auto;
      flex-shrink: 0;
    }

    /* ==========================================================================
       DISH CARDS:
       - TÊN MÓN ĂN
       - GIÁ TIỀN NGAY DƯỚI TÊN MÓN ĂN
       - KHÔNG CÓ NÚT ORDER (MÔ TẢ HIỂN THỊ TRONG MODAL CHI TIẾT)
       ========================================================================== */
    .dish-card {
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px solid var(--border-line);
      padding: 9px 11px;
      margin-bottom: 8px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .dish-card:last-child,
    .extra-item:last-child {
      margin-bottom: 0;
    }

    .dish-card:active {
      border-color: var(--caramel);
    }

    .dish-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .dish-title-area {
      flex: 1 1 0;
      min-width: 0;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 3px;
    }

    .badge-tag {
      font-size: 9.5px;
      font-weight: 800;
      padding: 1.5px 5px;
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
    }

    .badge-veg {
      background: #ECFDF5;
      color: #065F46;
      border: 1px solid #A7F3D0;
    }

    .badge-new {
      background: #FFF1F2;
      color: #9F1239;
      border: 1px solid #FECDD3;
    }

    .badge-lim {
      background: #FFFBEB;
      color: #92400E;
      border: 1px solid #FDE68A;
    }

    /* 1. TÊN MÓN ĂN (FULL TITLE) */
    .dish-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.35;
      word-break: break-word;
      overflow-wrap: anywhere;
      white-space: normal;
    }

    /* 2. GIÁ TIỀN NGAY DƯỚI TÊN MÓN ĂN */
    .dish-price-under-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--caramel-dark);
      font-feature-settings: "tnum";
      white-space: nowrap;
      margin-top: 3px;
      display: block;
    }

    /* THUMBNAIL */
    .dish-thumb {
      width: 102px;
      height: 102px;
      flex: 0 0 102px;
      border-radius: 12px;
      overflow: hidden;
      background: #F8ECE8;
      border: 1px solid var(--border-line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .dish-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 3. MÔ TẢ RÚT GỌN 2 DÒNG (KHÔNG KHUNG VIỀN) - BẤM VÀO XEM CHI TIẾT ĐẦY ĐỦ */
    .dish-desc {
      font-size: 11.5px;
      color: var(--ink-subtle);
      line-height: 1.4;
      margin-top: 5px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    /* EXTRAS LIST */
    .extra-item {
      background: #fff;
      border: 1px solid var(--border-line);
      border-radius: 12px;
      padding: 8px 10px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .extra-name {
      font-size: 12.5px;
      font-weight: 750;
      color: var(--ink);
      word-break: break-word;
      line-height: 1.3;
    }

    .extra-price {
      font-size: 12px;
      font-weight: 800;
      color: var(--caramel-dark);
      white-space: nowrap;
      font-feature-settings: "tnum";
    }

    /* ==========================================================================
       CENTERED DETAILS MODAL (KHÔNG CÓ ORDER BUTTON)
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 100;
      padding: 16px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      /* iOS: ngăn scroll xuyên qua modal */
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: auto;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
      touch-action: none; /* iOS: ngăn kéo nền khi modal mở */
    }

    .modal-sheet {
      background: #FFFFFF;
      width: 92%;
      max-width: 360px;
      border-radius: 18px;
      max-height: 78vh;
      max-height: 78dvh; /* iOS dynamic viewport height */
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      transform: scale(0.92);
      opacity: 0;
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .modal-backdrop.open .modal-sheet {
      transform: scale(1);
      opacity: 1;
      touch-action: pan-y; /* iOS: cho phép scroll dọc trong modal */
    }

    .sheet-handle {
      display: none;
    }

    .modal-img-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 175px;
      background: #F8EBE8;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
    }

    .modal-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .sheet-close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
      z-index: 10;
    }

    .sheet-body {
      padding: 12px 14px 16px;
    }

    .modal-title-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 6px;
    }

    .modal-title-row h2 {
      font-size: 16px;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.3;
      word-break: break-word;
    }

    .modal-price-tag {
      font-size: 15px;
      font-weight: 800;
      color: var(--caramel-dark);
      white-space: nowrap;
      font-feature-settings: "tnum";
    }

    .modal-desc-text {
      font-size: 12.5px;
      color: var(--ink-muted);
      line-height: 1.5;
      margin-top: 8px;
      padding: 10px 11px;
      background: #FFF9F6;
      border-radius: 10px;
      border: 1px solid var(--border-line);
      word-break: break-word;
      white-space: normal;
    }

    .sheet-close-action {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      border-radius: 11px;
      border: none;
      background: var(--caramel);
      color: #fff;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 360px) {
      .category-rail-vertical {
        width: 72px;
        flex: 0 0 72px;
      }
      .subcat-btn .sub-label {
        font-size: 9px;
      }
      .dish-thumb {
        width: 86px;
        height: 86px;
        flex: 0 0 86px;
      }
    }
  </style>

<body>

  <!-- MOBILE FRAME -->
  <div class="mobile-frame">
    <div class="hero-banner">
      <img
        src="https://sanyominhlong.vn/image/catalog/04.%20Cong-trinh/01.%20Nha-dan-biet-thu-villa/04.%20PONTE%20BOUTIQUE%20VILLA/ponte-boutique-villa01.jpg"
        alt="Ponte Boutique Villa"
        fetchpriority="high">
    </div>
    <!-- TOP APP BAR -->

      },
      zh: {
        mainCategories: ['餐食', '饮品'],
        categories: [
          ['三文鱼特选', '三文鱼'],
          ['早午餐 & 招牌', '早午餐'],
          ['三明治 & 沙拉', '三明治'],
          ['烘焙 & 配菜', '烘焙'],
          ['素食精选', '素食'],
          ['加料', '加料'],
          ['咖啡 & 招牌', '咖啡'],
          ['果汁、冰沙 & 抹茶', '果汁'],
          ['饮品加料', '饮品加料'],
        ],
        itemUnit: '道',
        badges: { veg: '🌱 素食', new: '✨ 新品', lim: '⭐ 限量' },
        defaultDesc: '每日于 Ponte 厨房新鲜现制。',
        hours: '每日 07:00 – 15:00',
        close: '关闭'
      },
      ko: {
        mainCategories: ['음식', '음료'],
        categories: [
          ['연어 스페셜', '연어'],
          ['브런치 & 시그니처', '브런치'],
          ['샌드위치 & 샐러드', '샌드위치'],
          ['베이커리 & 사이드', '베이커리'],
          ['채식 메뉴', '채식'],
          ['추가 토핑', '추가'],
          ['커피 & 시그니처', '커피'],
          ['주스, 스무디 & 말차', '주스'],
          ['음료 추가', '음료 추가'],
        ],
        itemUnit: '개',
        badges: { veg: '🌱 채식', new: '✨ 신메뉴', lim: '⭐ 한정' },
        defaultDesc: 'Ponte 주방에서 매일 신선하게 준비합니다.',
        hours: '매일 07:00 – 15:00',
        close: '닫기'
      }
    };

    const subcategoriesContainer = document.getElementById('subcategoriesContainer');
    const feedEl = document.getElementById('dishFeed');
    const languageSelectEl = document.getElementById('languageSelect');
    const searchToggleBtn = document.getElementById('searchToggleBtn');
    const searchBox = document.getElementById('searchBox');
    const searchInput = document.getElementById('searchInput');
    const searchClearBtn = document.getElementById('searchClearBtn');
    const btnPrimaryFood = document.getElementById('btnPrimaryFood');
    const btnPrimaryDrink = document.getElementById('btnPrimaryDrink');
    const labelPrimaryFood = document.getElementById('labelPrimaryFood');
    const labelPrimaryDrink = document.getElementById('labelPrimaryDrink');

    let currentLanguage = 'vi';
    let currentPrimary = 'food'; // 'food' or 'drinks'
    let currentSearch = '';

    const VEG_INDICES = new Set([4, 8, 9, 17, 19, 20]);

    function renderMenu() {
      const text = LANGUAGE_TEXT[currentLanguage] || LANGUAGE_TEXT.vi;
      const translations = MENU_TRANSLATIONS[currentLanguage] || MENU_TRANSLATIONS.vi;
      document.documentElement.lang = currentLanguage;

      labelPrimaryFood.textContent = text.mainCategories[0];
      labelPrimaryDrink.textContent = text.mainCategories[1];
      const hoursTextEl = document.getElementById('hoursText');
      if (hoursTextEl && text.hours) hoursTextEl.textContent = text.hours;
      const modalCloseActionEl = document.getElementById('modalCloseAction');
      if (modalCloseActionEl && text.close) modalCloseActionEl.textContent = text.close;

      const items = MENU_CATALOG.map((cat, idx) => {
        const tr = translations[idx] || translations[0];
        const rawImg = MENU_IMAGE_IDS[idx];
        const image = rawImg ? `https://images.unsplash.com/${rawImg}?auto=format&fit=crop&w=600&q=80` : '';
        const nameLower = (tr.name || '').toLowerCase();
        const isVeg = VEG_INDICES.has(idx) || nameLower.includes('chay') || nameLower.includes('vegetarian') || nameLower.includes('вегетариан') || nameLower.includes('素食') || nameLower.includes('채식');
        const isNew = nameLower.includes('mới') || nameLower.includes('new') || nameLower.includes('новинка') || nameLower.includes('新品') || nameLower.includes('신메뉴');
        const isLim = nameLower.includes('hạn') || nameLower.includes('limited') || nameLower.includes('ограничен') || nameLower.includes('限量') || nameLower.includes('한정');

        return {
          id: 'item-' + idx,
          index: idx,
          kind: cat.kind,
          price: cat.price,
          name: tr.name,
          desc: tr.desc || '',
          image,
          isVeg,
          isNew,
          isLim
        };
      });

      const allSectionDefs = [
        { id: 'salmon', mainCategory: 'food', icon: '🐟', indices: [0, 1, 2] },
        { id: 'brunch-signatures', mainCategory: 'food', icon: '🍳', indices: [3, 4, 5, 6, 7, 8, 9] },
        { id: 'sandwiches-salads', mainCategory: 'food', icon: '🥪', indices: [10, 11, 12, 13, 14, 15, 16, 17, 23] },
        { id: 'bakery-sides', mainCategory: 'food', icon: '🥐', indices: [18, 19, 20, 21, 22, 24] },
        { id: 'vegetarian', mainCategory: 'food', icon: '🌱', indices: [4, 8, 9, 17, 19, 20] },
        { id: 'food-extras', mainCategory: 'food', icon: '🧀', indices: Array.from({ length: 13 }, (_, i) => 25 + i) },
        { id: 'coffee-signatures', mainCategory: 'drinks', icon: '☕', indices: Array.from({ length: 15 }, (_, i) => 38 + i) },
        { id: 'drinks-matcha', mainCategory: 'drinks', icon: '🍹', indices: Array.from({ length: 19 }, (_, i) => 53 + i) },
        { id: 'drink-extras', mainCategory: 'drinks', icon: '🥤', indices: [72, 73, 74] },
      ];

      // Filter sections belonging to currentPrimary ('food' or 'drinks')
      const primarySections = allSectionDefs.filter(s => s.mainCategory === currentPrimary);

      const sections = primarySections.map(def => {
        const fullIndex = allSectionDefs.findIndex(s => s.id === def.id);
        const [title, navLabel] = text.categories[fullIndex];
        let secItems = def.indices.map(i => items[i]).filter(Boolean);

        if (currentSearch) {
          const q = currentSearch.toLowerCase();
          secItems = secItems.filter(item =>
            item.name.toLowerCase().includes(q) ||
            item.desc.toLowerCase().includes(q) ||
            item.price.toLowerCase().includes(q)
          );
        }

        if (secItems.length === 0) return null;

        return {
          id: def.id,
          title,
          navLabel,
          icon: def.icon,
          items: secItems
        };
      }).filter(Boolean);

      // Render Subcategories in the left vertical rail
      subcategoriesContainer.innerHTML = `
        <div class="sub-section-title">${currentPrimary === 'food' ? text.mainCategories[0] : text.mainCategories[1]}</div>
        ${sections.map((sec, i) => `
          <button class="subcat-btn ${i === 0 ? 'active' : ''}" data-target="${sec.id}">
            <span class="sub-icon">${sec.icon}</span>
            <span class="sub-label">${sec.navLabel}</span>
          </button>
        `).join('')}
      `;

      // Render Dish Feed
      if (sections.length === 0) {
        feedEl.innerHTML = `
          <div style="text-align:center; padding:50px 20px; color:#8C6D77;">
            <div style="font-size:32px; margin-bottom:10px;">🔍</div>
            <p style="font-size:15px; font-weight:700; color:#3B222C;">Không tìm thấy món phù hợp</p>
            <p style="font-size:12px; margin-top:4px;">Vui lòng thử tìm từ khóa khác</p>
          </div>
        `;
        return;
      }

      feedEl.innerHTML = sections.map(sec => {
        const extras = sec.items.filter(i => i.kind.endsWith('Extra'));
        const dishes = sec.items.filter(i => !i.kind.endsWith('Extra'));

        return `
          <section class="category-section" id="sec-${sec.id}" data-id="${sec.id}">
            <div class="section-header">
              <span class="sec-icon">${sec.icon}</span>
              <h2>${sec.title}</h2>
              <span class="count-tag">${sec.items.length} ${text.itemUnit || 'món'}</span>
            </div>

            ${extras.map(item => `
              <div class="extra-item" style="cursor:pointer;" data-dish='${JSON.stringify(item).replace(/'/g, "&apos;")}'>
                <div style="min-width:0; flex:1;">
                  <div class="extra-name">${item.name}</div>
                </div>
                <div class="extra-price">${item.price}</div>
              </div>
            `).join('')}

            ${dishes.map(item => `
              <article class="dish-card" data-dish='${JSON.stringify(item).replace(/'/g, "&apos;")}'>
                <div class="dish-top-row">
                  <div class="dish-title-area">
                    ${(item.isVeg || item.isNew || item.isLim) ? `
                      <div class="badge-row">
                        ${item.isVeg ? `<span class="badge-tag badge-veg">${text.badges.veg}</span>` : ''}
                        ${item.isNew ? `<span class="badge-tag badge-new">${text.badges.new}</span>` : ''}
                        ${item.isLim ? `<span class="badge-tag badge-lim">${text.badges.lim}</span>` : ''}
                      </div>
                    ` : ''}
                    <!-- 1. TÊN MÓN ĂN -->
                    <h3 class="dish-title">${item.name}</h3>
                    <!-- 2. GIÁ TIỀN NGAY DƯỚI TÊN MÓN ĂN -->
                    <span class="dish-price-under-title">${item.price}</span>
                    <!-- 3. MÔ TẢ RÚT GỌN NẰM TRONG CỘT TEXT BÊN TRÁI -->
                    ${item.desc ? `<p class="dish-desc">${item.desc}</p>` : ''}
                  </div>

                  ${item.image ? `
                    <div class="dish-thumb">
                      <img src="${item.image}" alt="${item.name}" loading="lazy">
                    </div>
                  ` : ''}
                </div>
              </article>
            `).join('')}
          </section>
        `;
      }).join('');
    }

    renderMenu();

    // Primary Tabs Click (Food vs Drinks)
    btnPrimaryFood.addEventListener('click', () => {
      btnPrimaryFood.classList.add('active');
      btnPrimaryDrink.classList.remove('active');
      currentPrimary = 'food';
      renderMenu();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    btnPrimaryDrink.addEventListener('click', () => {
      btnPrimaryDrink.classList.add('active');
      btnPrimaryFood.classList.remove('active');
      currentPrimary = 'drinks';
      renderMenu();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Search Toggle
    if (searchToggleBtn && searchBox) {
      searchToggleBtn.addEventListener('click', () => {
        searchBox.classList.toggle('open');
        if (searchBox.classList.contains('open')) {
          searchInput.focus();
        } else {
          currentSearch = '';
          searchInput.value = '';
          searchClearBtn.style.display = 'none';
          renderMenu();
        }
      });
    }

    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        currentSearch = e.target.value.trim();
        if (searchClearBtn) searchClearBtn.style.display = currentSearch ? 'block' : 'none';
        renderMenu();
      });
    }

    if (searchClearBtn) {
      searchClearBtn.addEventListener('click', () => {
        if (searchInput) searchInput.value = '';
        currentSearch = '';
        searchClearBtn.style.display = 'none';
        renderMenu();
      });
    }

    // Language Change
    languageSelectEl.addEventListener('change', (e) => {
      currentLanguage = e.target.value;
      renderMenu();
    });

    // Subcategory Rail Click -> Smooth Scroll
    subcategoriesContainer.addEventListener('click', (e) => {
      const btn = e.target.closest('.subcat-btn');
      if (!btn) return;
      const targetId = btn.dataset.target;
      const sec = document.getElementById('sec-' + targetId);
      if (sec) {
        document.querySelectorAll('.subcat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const yOffset = -64;
        const y = sec.getBoundingClientRect().top + window.pageYOffset + yOffset;
        window.scrollTo({ top: y, behavior: 'smooth' });
      }
    });

    // Scrollspy for Subcategories
    window.addEventListener('scroll', () => {
      const sections = document.querySelectorAll('.category-section');
      const scrollPos = window.scrollY + 130;

      for (let i = sections.length - 1; i >= 0; i--) {
        const sec = sections[i];
        if (sec.offsetTop <= scrollPos) {
          const id = sec.dataset.id;
          document.querySelectorAll('.subcat-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.target === id);
          });
          break;
        }
      }
    }, { passive: true });

    // Dish Click -> Modal Details Sheet (No Order Button)
    const backdrop = document.getElementById('modalBackdrop');
    const modalTitle = document.getElementById('modalTitle');
    const modalPrice = document.getElementById('modalPrice');
    const modalDesc = document.getElementById('modalDesc');
    const modalImg = document.getElementById('modalImg');
    const modalBadges = document.getElementById('modalBadges');

    // iOS scroll lock: lưu vị trí scroll để phục hồi
    let scrollPosition = 0;

    function lockBodyScroll() {
      scrollPosition = window.pageYOffset || document.documentElement.scrollTop;
      document.documentElement.classList.add('modal-open');
      document.body.style.top = `-${scrollPosition}px`;
    }

    function unlockBodyScroll() {
      document.documentElement.classList.remove('modal-open');
      document.body.style.top = '';
      document.body.style.overflow = '';
      window.scrollTo(0, scrollPosition);
    }

    // Ngăn scroll xuyên qua backdrop trên iOS
    backdrop.addEventListener('touchmove', function(e) {
      const sheet = document.getElementById('modalSheet');
      // Chỉ cho phép scroll trong modal-sheet, chặn ở backdrop
      if (!sheet.contains(e.target)) {
        e.preventDefault();
      }
    }, { passive: false });

    // Ngăn scroll bounce trong modal-sheet khi đã scroll hết
    document.getElementById('modalSheet').addEventListener('touchmove', function(e) {
      const el = this;
      if (el.scrollHeight <= el.clientHeight + 1) {
        e.preventDefault();
        return;
      }
      const top = el.scrollTop;
      const totalScroll = el.scrollHeight;
      const currentScroll = top + el.offsetHeight;

      if (top === 0) {
        el.scrollTop = 1;
      } else if (currentScroll >= totalScroll) {
        el.scrollTop = top - 1;
      }
    }, { passive: false });

    function openDishModal(dish) {
      const text = LANGUAGE_TEXT[currentLanguage] || LANGUAGE_TEXT.vi;
      const sheet = document.getElementById('modalSheet');
      const imgWrap = modalImg.parentElement;
      modalTitle.textContent = dish.name;
      modalPrice.textContent = dish.price;
      modalDesc.textContent = dish.desc || text.defaultDesc;
      modalImg.src = dish.image || '';
      imgWrap.style.display = dish.image ? 'block' : 'none';
      modalImg.style.display = dish.image ? 'block' : 'none';

      let badgesHtml = '';
      if (dish.isVeg) badgesHtml += `<span class="badge-tag badge-veg">${text.badges.veg}</span>`;
      if (dish.isNew) badgesHtml += `<span class="badge-tag badge-new">${text.badges.new}</span>`;
      if (dish.isLim) badgesHtml += `<span class="badge-tag badge-lim">${text.badges.lim}</span>`;
      modalBadges.innerHTML = badgesHtml;

      sheet.scrollTop = 0;
      backdrop.classList.add('open');
      lockBodyScroll();
    }

    feedEl.addEventListener('click', (e) => {
      const card = e.target.closest('.dish-card, .extra-item');
      if (!card) return;
      const dish = JSON.parse(card.dataset.dish);
      openDishModal(dish);
    });

    function closeModal() {
      backdrop.classList.remove('open');
      unlockBodyScroll();
    }

    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    document.getElementById('modalCloseAction').addEventListener('click', closeModal);
    backdrop.addEventListener('click', (e) => {
      if (e.target === backdrop) closeModal();
    });
  </script>
</body>
</html>
